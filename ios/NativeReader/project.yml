name: XiaomanReading
options:
  bundleIdPrefix: com.chchok
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: NO
targets:
  XiaomanReading-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/NativeReader
      - path: ../NativeApp/AppMain.swift
      - path: ../NativeApp/Info.plist
        buildPhase: none
      - path: Resources/config.json
        buildPhase: resources
      - path: Resources/filter.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chchok.xiaomanreading.ios
        INFOPLIST_FILE: ../NativeApp/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/../NativeApp/FqNativeCore.h
        HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)/../NativeApp
        OTHER_LDFLAGS[sdk=iphoneos*]: $(inherited) -force_load $(SRCROOT)/../Frameworks/libfqapi_core_ios.a -framework Security -framework CoreFoundation -lz -liconv
        OTHER_LDFLAGS[sdk=iphonesimulator*]: $(inherited) -force_load $(SRCROOT)/../Frameworks/libfqapi_core_iphonesimulator.a -framework Security -framework CoreFoundation -lz -liconv
  XiaomanReading-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources/NativeReader
      - path: ../NativeApp/AppMain.swift
      - path: ../NativeApp/Info.plist
        buildPhase: none
      - path: Resources/config.json
        buildPhase: resources
      - path: Resources/filter.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chchok.xiaomanreading.macos
        INFOPLIST_FILE: ../NativeApp/Info.plist
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        SWIFT_OBJC_BRIDGING_HEADER: $(SRCROOT)/../NativeApp/FqNativeCore.h
        HEADER_SEARCH_PATHS: $(inherited) $(SRCROOT)/../NativeApp
        OTHER_LDFLAGS: $(inherited) -force_load $(SRCROOT)/../Frameworks/libfqapi_core_macos_universal.a -framework Security -framework CoreFoundation -lz -liconv
schemes:
  XiaomanReading-iOS:
    build:
      targets:
        XiaomanReading-iOS: all
  XiaomanReading-macOS:
    build:
      targets:
        XiaomanReading-macOS: all
